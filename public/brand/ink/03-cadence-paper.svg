<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 170 700 110" width="700" height="110">
<defs>
<filter id="dry" x="-5%" y="-5%" width="110%" height="110%">
  <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="grain" x="0" y="0" width="100%" height="100%">
  <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" seed="11" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/>
  <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
</filter>
<filter id="bleed" x="-5%" y="-5%" width="110%" height="110%">
  <feMorphology operator="dilate" radius="0.6"/>
  <feGaussianBlur stdDeviation="0.35"/>
</filter>
</defs>

